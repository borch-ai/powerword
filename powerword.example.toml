model = "claude-sonnet-4-6"
enable_critic = false

[servers.kdp_math]
   command = "go"
   args = ["run", "./cmd/pw-mcp-kdp-math"]

[servers.seo]
   command = "go"
   args = ["run", "./cmd/pw-mcp-seo"]

[servers.trends]
   command = "go"
   args = ["run", "./cmd/pw-mcp-trends"]

[plugins.trends]
# SerpAPI key for Google Trends velocity scores.
# If unset, only Amazon completion data is returned.
serp_api_key = ""

[plugins.gdoc]
credentials_path = "~/.config/powerword/credentials.json"
token_path = "~/.config/powerword/gdoc_token.json"
# Or for service account:
# service_account_path = "~/.config/powerword/service_account.json"

[servers.amazon]
   command = "go"
   args = ["run", "./cmd/pw-mcp-amazon"]

[plugins.amazon]
# ScaleSerp API key. Set to "mock" for local offline testing (returns 4200).
api_key = ""
base_url = "" # Optional. Defaults to https://api.scaleserp.com


