name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Run Markdown Linting & Plan Validation
        run: make markdown-lint

      - name: Run Vulnerability Scan
        run: make vuln

      - name: Run Tests & Check Coverage
        run: make check-coverage

      - name: Run Semantic Release
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Git Tag
        if: steps.semrel.outputs.version != ''
        run: |
          VERSION="${{ steps.semrel.outputs.version }}"
          VERSION_TAG="v${VERSION#v}"
          echo "Normalizing tag to: ${VERSION_TAG}"
          if git rev-parse "${VERSION_TAG}" >/dev/null 2>&1; then
            echo "Tag ${VERSION_TAG} already exists locally."
          else
            git tag "${VERSION_TAG}"
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION_TAG}"; then
            echo "Tag ${VERSION_TAG} already exists on remote origin."
          else
            git push origin "${VERSION_TAG}"
          fi

      - name: Build powerword Binaries
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          mkdir -p dist
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          echo "Building version ${VERSION_TAG}..."
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/borch-ai/powerword/pkg/config.Version=${VERSION_TAG}" -o dist/powerword-darwin-amd64 ./cmd/powerword
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/borch-ai/powerword/pkg/config.Version=${VERSION_TAG}" -o dist/powerword-darwin-arm64 ./cmd/powerword
          GOOS=linux GOARCH=amd64 go build -ldflags "-X github.com/borch-ai/powerword/pkg/config.Version=${VERSION_TAG}" -o dist/powerword-linux-amd64 ./cmd/powerword
          GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/borch-ai/powerword/pkg/config.Version=${VERSION_TAG}" -o dist/powerword-linux-arm64 ./cmd/powerword
          GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/borch-ai/powerword/pkg/config.Version=${VERSION_TAG}" -o dist/powerword-windows-amd64.exe ./cmd/powerword

      - name: Upload Binaries to GitHub Release
        if: steps.semrel.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          gh release upload "$VERSION_TAG" dist/* --clobber
