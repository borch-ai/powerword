name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Run Markdown Linting & Plan Validation
        run: make markdown-lint

      - name: Run Vulnerability Scan
        run: make vuln

      - name: Run Tests & Check Coverage
        run: make check-coverage

      - name: Run Semantic Release
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Git Tag
        if: steps.semrel.outputs.version != ''
        run: |
          VERSION="${{ steps.semrel.outputs.version }}"
          VERSION_TAG="v${VERSION#v}"
          echo "Normalizing tag to: ${VERSION_TAG}"
          if git rev-parse "${VERSION_TAG}" >/dev/null 2>&1; then
            echo "Tag ${VERSION_TAG} already exists locally."
          else
            git tag "${VERSION_TAG}"
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION_TAG}"; then
            echo "Tag ${VERSION_TAG} already exists on remote origin."
          else
            git push origin "${VERSION_TAG}"
          fi

      - name: Build powerword and MCP Plugin Binaries
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          mkdir -p dist
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          echo "Building version ${VERSION_TAG}..."

          TARGETS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )

          PKGS=("./cmd/powerword")
          for dir in cmd/pw-mcp-*; do
            if [ -d "$dir" ] && [ "$(basename "$dir")" != "pw-mcp-db" ]; then
              PKGS+=("./$dir")
            fi
          done

          for pkg in "${PKGS[@]}"; do
            bin_name=$(basename "$pkg")
            echo "Compiling ${bin_name}..."
            for target in "${TARGETS[@]}"; do
              os="${target%%/*}"
              arch="${target##*/}"
              ext=""
              if [ "$os" = "windows" ]; then
                ext=".exe"
              fi
              out="dist/${bin_name}-${os}-${arch}${ext}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -ldflags "-X github.com/borch-ai/powerword/pkg/config.Version=${VERSION_TAG}" \
                -o "$out" "$pkg"
            done
          done

      - name: Upload Binaries to GitHub Release
        if: steps.semrel.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          gh release upload "$VERSION_TAG" dist/* --clobber
