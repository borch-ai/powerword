name: "CodeQL Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Path filtering: only run CodeQL when Go source files or workflow config changes
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    uses: borch-ai/.github/.github/workflows/codeql.yml@feature/add-codeql-workflow
    with:
      language: "go"
